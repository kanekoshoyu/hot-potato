# Coolify compose: no host networking, no published ports —
# the domain (https://potato-agent.daometric.com) is set in Coolify
# (docker_compose_domains) and coolify-proxy (Traefik) routes 443 → container:8080.
services:
  hot-potato:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOT_POTATO_NAME: hot-potato
      HOT_POTATO_DESCRIPTION: 'EventMessageBus for AI agents'
      HOT_POTATO_URL: 'http://localhost:8080'
      HOT_POTATO_DATA_DIR: /data
      RUST_LOG: info
    volumes:
      - hot-potato-data:/data
volumes:
  hot-potato-data:
