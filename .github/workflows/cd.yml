name: CD

# Auto-deploy after CI passes on main.
# - fleet pool: Coolify API rebuild (operator's Coolify instance)
# - prod pool: Coolify API rebuild (second operator's Coolify instance)
#
# Secrets (all set 2026-09-12):
#   COOLIFY_URL            fleet Coolify base URL
#   COOLIFY_PAT            fleet Coolify API token (patricia-api, id 5)
#   COOLIFY_FLEET_APP_UUID hot-potato app uuid in fleet pool
#   COOLIFY_PROD_WEBHOOK   full deploy URL incl. ?uuid=...&force=true
#   COOLIFY_PROD_TOKEN     prod deploy-scoped API token (anastasia personal_access_tokens
#                          id=13 "ci-prod-deploy"; deploy ability ONLY — version/services
#                          endpoints 403. Revoke anytime via anastasia.)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-fleet:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Coolify rebuild (fleet pool)
        run: |
          if [ -z "${{ secrets.COOLIFY_URL }}" ] || [ -z "${{ secrets.COOLIFY_PAT }}" ]; then
            echo "::warning::fleet Coolify secrets not set — skipping fleet deploy"
            exit 0
          fi
          curl -sS -f -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "${{ secrets.COOLIFY_FLEET_APP_UUID }}", "force": true}'
          echo "fleet deploy triggered"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-fleet
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Coolify rebuild (prod pool)
        run: |
          if [ -z "${{ secrets.COOLIFY_PROD_WEBHOOK }}" ]; then
            echo "::warning::COOLIFY_PROD_WEBHOOK not set — prod deploys manually for now"
            exit 0
          fi
          set +e
          RESP=$(curl -sS --max-time 30 -X POST "${{ secrets.COOLIFY_PROD_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_PROD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w '\nHTTP_STATUS:%{http_code}')
          STATUS=$(echo "$RESP" | tail -1 | sed 's/HTTP_STATUS://')
          echo "$RESP"
          echo "prod deploy HTTP status: $STATUS"
          case "$STATUS" in
            200) echo "prod deploy triggered" ;;
            *) echo "::error::prod deploy failed with HTTP $STATUS"; exit 1 ;;
          esac
