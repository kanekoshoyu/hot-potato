# deploy-fleet.yml — hot-potato fleet box 自动部署 (RFC-004 部署链)

# Sho 命名规范 (2026-09-11):
#   Pool A (sho)       Pool B (fleet)
#   potato.daometric.com  potato-agent.daometric.com
#   coolify.daometric.com coolify-agent.daometric.com
# runner label: potato-agent (唯一, 不用 daometric-dev)

name: Deploy Fleet Bus

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'docker-compose.yml'

jobs:
  deploy-fleet:
    name: potato-agent.daometric.com (fleet box)
    runs-on: [self-hosted, potato-agent]
    steps:
      - name: Pull & rebuild bus
        working-directory: /opt/hot-potato
        run: |
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
      - name: Verify
        run: |
          sleep 3
          curl -sf http://127.0.0.1:8081/version
          echo
          curl -sf http://127.0.0.1:8081/health
